<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Takım — BasMedia</title>
<meta name="description" id="pageDesc" content="Takım kadrosu ve piyasa değeri.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>BasMedia — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">🏆 Takım Profili</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="BasMedia logo"></a>
    <nav class="bm-nav" id="mainNav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html">Oyuncular</a>
      <a href="/takimlar.html" class="active">Takımlar</a>
      <a href="/haberler.html">Haberler</a>
    </nav>
    <div class="bm-search" id="mainSearch">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
    <button class="bm-hamburger" id="hamburgerBtn" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div id="pageContent">
  <div style="padding:80px 0; text-align:center; color:#6B7280;">Takım bilgileri yükleniyor…</div>
</div>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> BasMedia. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchTeamById, fetchTeamSeasonsList, fetchPlayers, getIdFromPath, formatCurrency, formatDate } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const mainNav = document.getElementById("mainNav");
  const mainSearch = document.getElementById("mainSearch");
  hamburgerBtn.addEventListener("click", () => {
    hamburgerBtn.classList.toggle("open");
    mainNav.classList.toggle("mobile-open");
    mainSearch.classList.toggle("mobile-open");
  });
  mainNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    hamburgerBtn.classList.remove("open");
    mainNav.classList.remove("mobile-open");
    mainSearch.classList.remove("mobile-open");
  }));

  const quickSearch = document.getElementById("quickSearch");
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && quickSearch.value.trim()) {
      window.location.href = `/oyuncular.html?q=${encodeURIComponent(quickSearch.value.trim())}`;
    }
  });

  const content = document.getElementById("pageContent");
  const id = getIdFromPath("takim");
  const urlParams = new URLSearchParams(window.location.search);

  function renderNotFound() {
    content.innerHTML = `
      <div class="container" style="padding:80px 0;">
        <div class="bm-empty">
          <div class="icon">🚫</div>
          <p>Bu ID'ye ait bir takım bulunamadı.</p>
          <a href="/takimlar.html" class="bm-btn dark" style="margin-top:14px;">Takımlara Dön</a>
        </div>
      </div>`;
  }

  function playerRow(p) {
    return `
      <a href="/oyuncu/${p.id}" class="bm-roster-row">
        <span class="jersey">${p.jerseyNumber ? "#" + p.jerseyNumber : ""}</span>
        <div class="photo"><img src="${p.photoUrl || '/assets/logo.png'}" alt="${p.name}"
             style="object-position: ${p.photoPositionX ?? 50}% ${p.photoPositionY ?? 20}%; transform: scale(${(p.photoZoom ?? 100) / 100});"></div>
        <div class="main">
          <div class="name">${p.name}</div>
          <div class="pos">${p.position || ""}</div>
        </div>
        <div class="value">${formatCurrency(p.marketValue, p.currency)}</div>
      </a>`;
  }

  function renderShell(t, seasons, initialSeason) {
    document.getElementById("pageTitle").textContent = `${t.name} — BasMedia`;
    document.getElementById("pageDesc").content = `${t.name} kadrosu ve piyasa değeri`;

    content.innerHTML = `
      <section class="bm-player-hero">
        <div class="container wrap">
          <div class="photo" style="background:#fff; display:flex; align-items:center; justify-content:center;">
            <img src="${t.logoUrl || '/assets/logo.png'}" alt="${t.name}" style="width:70%; height:70%; object-fit:contain;">
          </div>
          <div>
            <h1>${t.name}</h1>
            <p class="sub">${t.city || ""}</p>
            <div class="tags" style="align-items:center;">
              <select id="seasonSelect" style="font-family:var(--bm-font-body); font-size:13px; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); color:#fff;">
                ${seasons.map(s => `<option value="${s.id}" ${s.id === initialSeason ? "selected" : ""} style="color:#000;">${s.label || s.id}</option>`).join("")}
              </select>
              <span class="bm-tag" id="tagLeague"></span>
              <span class="bm-tag" id="tagCount"></span>
            </div>
          </div>
        </div>
      </section>

      <div class="container">
        <div class="bm-detail-grid">
          <div>
            <div class="bm-panel">
              <h3>Takım Bilgileri</h3>
              <div class="bm-info-row"><span class="k">Şehir</span><span class="v">${t.city || "—"}</span></div>
              <div class="bm-info-row"><span class="k">Lig</span><span class="v" id="infoLeague">—</span></div>
              <div class="bm-info-row"><span class="k">Kadro Sayısı</span><span class="v" id="infoCount">—</span></div>
            </div>
          </div>
          <div>
            <div class="bm-panel bm-value-box">
              <h3 style="border:none;">Toplam Kadro Değeri</h3>
              <div class="big" id="valueBig">—</div>
              <div class="small" id="valueUpdated">—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="container bm-section">
        <div class="bm-section-head">
          <div><span class="bm-eyebrow">Kadro</span><h2>Oyuncular</h2></div>
        </div>
        <div class="bm-roster" id="teamPlayers">
          <div class="bm-skel" style="height:60px; margin:10px;"></div>
          <div class="bm-skel" style="height:60px; margin:10px;"></div>
        </div>
      </div>`;

    document.getElementById("seasonSelect").addEventListener("change", (e) => {
      const newSeason = e.target.value;
      const url = new URL(window.location.href);
      url.searchParams.set("season", newSeason);
      window.history.replaceState({}, "", url);
      loadSeasonPart(newSeason);
    });
  }

  async function loadSeasonPart(season) {
    const box = document.getElementById("teamPlayers");
    box.innerHTML = `<div class="bm-skel" style="height:60px; margin:10px;"></div>`;
    try {
      const t = await fetchTeamById(id, season);
      document.getElementById("tagLeague").textContent = t.league || "Lig belirtilmedi";
      document.getElementById("tagCount").textContent = `${t.playerCount ?? 0} oyuncu`;
      document.getElementById("infoLeague").textContent = t.league || "—";
      document.getElementById("infoCount").textContent = t.playerCount ?? "—";
      document.getElementById("valueBig").textContent = formatCurrency(t.totalValue, t.totalValueCurrency || "EUR");
      document.getElementById("valueUpdated").textContent = t.totalValueUpdatedAt
        ? `Son güncelleme: ${formatDate(t.totalValueUpdatedAt)}` : "—";

      const players = await fetchPlayers({ season, teamId: id });
      box.innerHTML = players.length
        ? players.map(playerRow).join("")
        : `<div class="bm-empty"><div class="icon">🏀</div>Bu takımın ${season} sezonunda kadrosu yok.</div>`;
    } catch (err) {
      console.error(err);
      box.innerHTML = `<div class="bm-empty"><div class="icon">⚠️</div>Kadro yüklenemedi.</div>`;
    }
  }

  (async () => {
    if (!id) { renderNotFound(); return; }
    try {
      const team = await fetchTeamById(id);
      if (!team) { renderNotFound(); return; }
      const seasons = await fetchTeamSeasonsList(id);
      if (seasons.length === 0) { renderNotFound(); return; }
      const urlSeason = urlParams.get("season");
      const initialSeason = (urlSeason && seasons.some(s => s.id === urlSeason)) ? urlSeason : (team.currentSeason || seasons[0].id);
      renderShell(team, seasons, initialSeason);
      await loadSeasonPart(initialSeason);
    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="container" style="padding:80px 0;"><div class="bm-empty"><div class="icon">⚠️</div>Takım yüklenemedi. Firebase yapılandırmasını kontrol et.</div></div>`;
    }
  })();
</script>
</body>
</html>
