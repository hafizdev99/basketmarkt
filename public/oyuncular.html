<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyuncular — Basketmarkt</title>
<meta name="description" content="NBA, EuroLeague, BSL ve tüm liglerden basketbol oyuncularının piyasa değerlerini keşfet.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>Basketmarkt — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">🏀 Oyuncular</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="Basketmarkt logo"></a>
    <nav class="bm-nav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html" class="active">Oyuncular</a>
      <a href="/takimlar.html">Takımlar</a>
      <a href="/haberler.html">Haberler</a>
    </nav>
    <div class="bm-search">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
  </div>
</header>

<main class="container bm-section">
  <div class="bm-section-head">
    <div>
      <span class="bm-eyebrow">Veritabanı</span>
      <h2>Tüm Oyuncular</h2>
    </div>
  </div>

  <div class="bm-filters">
    <select id="fLeague">
      <option value="">Tüm Ligler</option>
      <option value="NBA">NBA</option>
      <option value="EuroLeague">EuroLeague</option>
      <option value="BSL">BSL (Türkiye)</option>
    </select>
    <select id="fPosition">
      <option value="">Tüm Pozisyonlar</option>
      <option value="PG">Point Guard</option>
      <option value="SG">Shooting Guard</option>
      <option value="SF">Small Forward</option>
      <option value="PF">Power Forward</option>
      <option value="C">Center</option>
    </select>
    <input type="text" id="fSearch" placeholder="İsme göre ara…">
  </div>

  <div class="bm-grid cols-4" id="playersGrid">
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
    <div class="bm-skel" style="aspect-ratio:4/5.6;"></div>
  </div>
</main>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> Basketmarkt. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchPlayers, formatCurrency } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const grid = document.getElementById("playersGrid");
  const fLeague = document.getElementById("fLeague");
  const fPosition = document.getElementById("fPosition");
  const fSearch = document.getElementById("fSearch");
  const quickSearch = document.getElementById("quickSearch");

  const params = new URLSearchParams(window.location.search);
  if (params.get("league")) fLeague.value = params.get("league");
  if (params.get("q")) fSearch.value = params.get("q");

  function playerCard(p) {
    return `
      <a href="/oyuncu/${p.id}" class="bm-player-card">
        <div class="photo-wrap">
          <img src="${p.photoUrl || '/assets/logo.png'}" alt="${p.name}" loading="lazy"
               style="object-position: ${p.photoPositionX ?? 50}% ${p.photoPositionY ?? 20}%;">
          ${p.jerseyNumber ? `<span class="num">#${p.jerseyNumber}</span>` : ""}
          <span class="value-tag">${formatCurrency(p.marketValue, p.currency)}</span>
        </div>
        <div class="info">
          <p class="name">${p.name}</p>
          <p class="meta">${p.position || ""} · ${p.team || ""}</p>
        </div>
      </a>`;
  }

  async function load() {
    grid.innerHTML = Array(8).fill('<div class="bm-skel" style="aspect-ratio:4/5.6;"></div>').join("");
    try {
      const players = await fetchPlayers({
        league: fLeague.value || undefined,
        position: fPosition.value || undefined,
        search: fSearch.value || undefined,
      });
      grid.innerHTML = players.length
        ? players.map(playerCard).join("")
        : `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">🔍</div>Kriterlere uyan oyuncu bulunamadı.</div>`;
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">⚠️</div>Veriler yüklenemedi. Firebase yapılandırmasını kontrol et.</div>`;
    }
  }

  fLeague.addEventListener("change", load);
  fPosition.addEventListener("change", load);
  let t;
  fSearch.addEventListener("input", () => { clearTimeout(t); t = setTimeout(load, 300); });
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { fSearch.value = quickSearch.value; load(); }
  });

  load();
</script>
</body>
</html>
