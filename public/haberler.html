<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haberler — Basketmarkt</title>
<meta name="description" content="Basketbol dünyasından son transfer haberleri ve gelişmeler.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>Basketmarkt — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">📰 Haberler</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="Basketmarkt logo"></a>
    <nav class="bm-nav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html">Oyuncular</a>
      <a href="/takimlar.html">Takımlar</a>
      <a href="/haberler.html" class="active">Haberler</a>
    </nav>
    <div class="bm-search">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
  </div>
</header>

<main class="container bm-section">
  <div class="bm-section-head">
    <div>
      <span class="bm-eyebrow">Gündem</span>
      <h2>Tüm Haberler</h2>
    </div>
  </div>
  <div class="bm-grid cols-3" id="newsGrid">
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
    <div class="bm-skel" style="aspect-ratio:16/13;"></div>
  </div>
</main>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> Basketmarkt. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchNews, formatDate } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const quickSearch = document.getElementById("quickSearch");
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && quickSearch.value.trim()) {
      window.location.href = `/oyuncular.html?q=${encodeURIComponent(quickSearch.value.trim())}`;
    }
  });

  function newsCard(n) {
    return `
      <a href="/haber/${n.id}" class="bm-news-card">
        <div class="img-wrap"><img src="${n.coverImage || '/assets/logo.png'}" alt="${n.title}" loading="lazy"></div>
        <div class="body">
          <span class="cat">${n.category || "Haber"}</span>
          <h3>${n.title}</h3>
          <span class="date">${formatDate(n.publishedAt)}</span>
        </div>
      </a>`;
  }

  (async () => {
    const grid = document.getElementById("newsGrid");
    try {
      const news = await fetchNews(30);
      grid.innerHTML = news.length
        ? news.map(newsCard).join("")
        : `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">📰</div>Henüz haber eklenmedi.</div>`;
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">⚠️</div>Haberler yüklenemedi.</div>`;
    }
  })();
</script>
</body>
</html>
