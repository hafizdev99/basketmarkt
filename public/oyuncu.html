<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Oyuncu — BasMedia</title>
<meta name="description" id="pageDesc" content="Oyuncu profili, piyasa değeri ve istatistikler.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>BasMedia — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">🏀 Oyuncu Profili</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="BasMedia logo"></a>
    <nav class="bm-nav" id="mainNav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html" class="active">Oyuncular</a>
      <a href="/takimlar.html">Takımlar</a>
      <a href="/haberler.html">Haberler</a>
    </nav>
    <div class="bm-search" id="mainSearch">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
    <button class="bm-hamburger" id="hamburgerBtn" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div id="pageContent">
  <!-- JS ile doldurulacak -->
  <div style="padding:80px 0; text-align:center; color:#6B7280;">Oyuncu bilgileri yükleniyor…</div>
</div>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> BasMedia. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchPlayerById, fetchPlayerSeasonsList, getIdFromPath, formatCurrency, formatDate } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const mainNav = document.getElementById("mainNav");
  const mainSearch = document.getElementById("mainSearch");
  hamburgerBtn.addEventListener("click", () => {
    hamburgerBtn.classList.toggle("open");
    mainNav.classList.toggle("mobile-open");
    mainSearch.classList.toggle("mobile-open");
  });
  mainNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    hamburgerBtn.classList.remove("open");
    mainNav.classList.remove("mobile-open");
    mainSearch.classList.remove("mobile-open");
  }));

  const quickSearch = document.getElementById("quickSearch");
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && quickSearch.value.trim()) {
      window.location.href = `/oyuncular.html?q=${encodeURIComponent(quickSearch.value.trim())}`;
    }
  });

  const content = document.getElementById("pageContent");
  const id = getIdFromPath("oyuncu");
  const urlParams = new URLSearchParams(window.location.search);

  function renderNotFound() {
    content.innerHTML = `
      <div class="container" style="padding:80px 0;">
        <div class="bm-empty">
          <div class="icon">🚫</div>
          <p>Bu ID'ye ait bir oyuncu bulunamadı.</p>
          <a href="/oyuncular.html" class="bm-btn dark" style="margin-top:14px;">Oyunculara Dön</a>
        </div>
      </div>`;
  }

  function renderShell(p, seasons, initialSeason) {
    document.getElementById("pageTitle").textContent = `${p.name} — BasMedia`;
    document.getElementById("pageDesc").content = `${p.name} piyasa değeri, istatistikleri ve profil bilgileri`;

    content.innerHTML = `
      <section class="bm-player-hero">
        <div class="container wrap">
          <div class="photo"><img src="${p.photoUrl || '/assets/logo.png'}" alt="${p.name}"
               style="object-position: ${p.photoPositionX ?? 50}% ${p.photoPositionY ?? 20}%; transform: scale(${(p.photoZoom ?? 100) / 100});"></div>
          <div>
            <h1>${p.name}</h1>
            <p class="sub" id="subLine">—</p>
            <div class="tags" style="align-items:center;">
              <select id="seasonSelect" style="font-family:var(--bm-font-body); font-size:13px; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); color:#fff;">
                ${seasons.map(s => `<option value="${s.id}" ${s.id === initialSeason ? "selected" : ""} style="color:#000;">${s.label || s.id}</option>`).join("")}
              </select>
              ${p.nationality ? `<span class="bm-tag">${p.nationality}</span>` : ""}
              ${p.height ? `<span class="bm-tag">${p.height} cm</span>` : ""}
              ${p.weight ? `<span class="bm-tag">${p.weight} kg</span>` : ""}
            </div>
          </div>
        </div>
      </section>

      <div class="container">
        <div class="bm-stats-strip" id="statsStrip">
          <div class="cell"><div class="val">—</div><div class="lbl">Sayı / Maç</div></div>
          <div class="cell"><div class="val">—</div><div class="lbl">Ribaunt / Maç</div></div>
          <div class="cell"><div class="val">—</div><div class="lbl">Asist / Maç</div></div>
          <div class="cell"><div class="val">—</div><div class="lbl">Top Çalma / Maç</div></div>
        </div>

        <div class="bm-detail-grid">
          <div>
            <div class="bm-panel">
              <h3>Oyuncu Bilgileri</h3>
              <div class="bm-info-row"><span class="k">Doğum Tarihi</span><span class="v">${p.birthDate ? formatDate(p.birthDate) : "—"}</span></div>
              <div class="bm-info-row"><span class="k">Uyruk</span><span class="v">${p.nationality || "—"}</span></div>
              <div class="bm-info-row"><span class="k">Boy</span><span class="v">${p.height ? p.height + " cm" : "—"}</span></div>
              <div class="bm-info-row"><span class="k">Kilo</span><span class="v">${p.weight ? p.weight + " kg" : "—"}</span></div>
              <div class="bm-info-row"><span class="k">Pozisyon</span><span class="v" id="infoPosition">—</span></div>
              <div class="bm-info-row"><span class="k">Mevcut Takım</span><span class="v" id="infoTeam">—</span></div>
              <div class="bm-info-row"><span class="k">Lig</span><span class="v" id="infoLeague">—</span></div>
              <div class="bm-info-row"><span class="k">Sözleşme Bitişi</span><span class="v" id="infoContract">—</span></div>
            </div>
            ${p.bio ? `<div class="bm-panel"><h3>Biyografi</h3><p style="line-height:1.7; color:#2A2D31;">${p.bio}</p></div>` : ""}
          </div>
          <div>
            <div class="bm-panel bm-value-box">
              <h3 style="border:none;">Güncel Piyasa Değeri</h3>
              <div class="big" id="valueBig">—</div>
              <div class="small" id="valueUpdated">—</div>
            </div>
          </div>
        </div>
      </div>`;

    document.getElementById("seasonSelect").addEventListener("change", (e) => {
      const newSeason = e.target.value;
      const url = new URL(window.location.href);
      url.searchParams.set("season", newSeason);
      window.history.replaceState({}, "", url);
      loadSeasonPart(newSeason);
    });
  }

  async function loadSeasonPart(season) {
    try {
      const p = await fetchPlayerById(id, season);
      document.getElementById("subLine").textContent =
        `${p.team || "Takımsız"}${p.jerseyNumber ? " · #" + p.jerseyNumber : ""}${p.league ? " · " + p.league : ""}`;
      document.getElementById("infoPosition").textContent = p.position || "—";
      document.getElementById("infoTeam").textContent = p.team || "—";
      document.getElementById("infoLeague").textContent = p.league || "—";
      document.getElementById("infoContract").textContent = p.contractUntil || "—";
      document.getElementById("valueBig").textContent = formatCurrency(p.marketValue, p.currency);
      document.getElementById("valueUpdated").textContent = p.valueUpdatedAt
        ? `Son güncelleme: ${formatDate(p.valueUpdatedAt)}` : "—";

      const strip = document.getElementById("statsStrip");
      strip.innerHTML = `
        <div class="cell"><div class="val">${p.stats?.ppg ?? "—"}</div><div class="lbl">Sayı / Maç</div></div>
        <div class="cell"><div class="val">${p.stats?.rpg ?? "—"}</div><div class="lbl">Ribaunt / Maç</div></div>
        <div class="cell"><div class="val">${p.stats?.apg ?? "—"}</div><div class="lbl">Asist / Maç</div></div>
        <div class="cell"><div class="val">${p.stats?.spg ?? "—"}</div><div class="lbl">Top Çalma / Maç</div></div>`;
    } catch (err) {
      console.error(err);
    }
  }

  (async () => {
    if (!id) { renderNotFound(); return; }
    try {
      const player = await fetchPlayerById(id);
      if (!player) { renderNotFound(); return; }
      const seasons = await fetchPlayerSeasonsList(id);
      if (seasons.length === 0) { renderNotFound(); return; }
      const urlSeason = urlParams.get("season");
      const initialSeason = (urlSeason && seasons.some(s => s.id === urlSeason)) ? urlSeason : (player.currentSeason || seasons[0].id);
      renderShell(player, seasons, initialSeason);
      await loadSeasonPart(initialSeason);
    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="container" style="padding:80px 0;"><div class="bm-empty"><div class="icon">⚠️</div>Oyuncu yüklenemedi. Firebase yapılandırmasını kontrol et.</div></div>`;
    }
  })();
</script>
</body>
</html>
