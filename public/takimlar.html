<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takımlar — Basketmarkt</title>
<meta name="description" content="NBA, EuroLeague ve BSL takımları.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .bm-team-card{ background:#fff; border:1px solid var(--bm-line); border-radius:var(--bm-radius); padding:22px; text-align:center; transition: box-shadow .15s ease, transform .15s ease; }
  .bm-team-card:hover{ box-shadow: var(--bm-shadow-lg); transform: translateY(-2px); }
  .bm-team-card img{ width:72px; height:72px; object-fit:contain; margin:0 auto 12px; }
  .bm-team-card .name{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .bm-team-card .meta{ color:var(--bm-gray); font-size:13px; }
</style>
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>Basketmarkt — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">🏆 Takımlar</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="Basketmarkt logo"></a>
    <nav class="bm-nav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html">Oyuncular</a>
      <a href="/takimlar.html" class="active">Takımlar</a>
      <a href="/haberler.html">Haberler</a>
    </nav>
    <div class="bm-search">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
  </div>
</header>

<main class="container bm-section">
  <div class="bm-section-head">
    <div>
      <span class="bm-eyebrow">Kulüpler</span>
      <h2>Tüm Takımlar</h2>
    </div>
  </div>

  <div class="bm-filters">
    <select id="fLeague">
      <option value="">Tüm Ligler</option>
      <option value="NBA">NBA</option>
      <option value="EuroLeague">EuroLeague</option>
      <option value="BSL">BSL (Türkiye)</option>
    </select>
  </div>

  <div class="bm-grid cols-4" id="teamsGrid">
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
  </div>
</main>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> Basketmarkt. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchTeams } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const quickSearch = document.getElementById("quickSearch");
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && quickSearch.value.trim()) {
      window.location.href = `/oyuncular.html?q=${encodeURIComponent(quickSearch.value.trim())}`;
    }
  });

  const grid = document.getElementById("teamsGrid");
  const fLeague = document.getElementById("fLeague");
  const params = new URLSearchParams(window.location.search);
  if (params.get("league")) fLeague.value = params.get("league");

  function teamCard(t) {
    return `
      <a href="/turnuva/takim/${t.id}" class="bm-team-card">
        <img src="${t.logoUrl || '/assets/logo.png'}" alt="${t.name}">
        <p class="name">${t.name}</p>
        <p class="meta">${t.city || ""} · ${t.league || ""}</p>
      </a>`;
  }

  async function load() {
    grid.innerHTML = Array(4).fill('<div class="bm-skel" style="aspect-ratio:1/1;"></div>').join("");
    try {
      const teams = await fetchTeams(fLeague.value || undefined);
      grid.innerHTML = teams.length
        ? teams.map(teamCard).join("")
        : `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">🏟️</div>Henüz takım eklenmedi. Firestore'daki <b>teams</b> koleksiyonuna veri ekleyince burada görünecek.</div>`;
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">⚠️</div>Takımlar yüklenemedi.</div>`;
    }
  }
  fLeague.addEventListener("change", load);
  load();
</script>
</body>
</html>
