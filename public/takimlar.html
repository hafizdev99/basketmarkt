<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takımlar — BasMedia</title>
<meta name="description" content="NBA, EuroLeague ve BSL takımları.">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bm-topbar">
  <div class="container">
    <span>BasMedia — Dünya basketbolunun piyasa değeri platformu</span>
    <span class="ticker">🏆 Takımlar</span>
  </div>
</div>

<header class="bm-header">
  <div class="container">
    <a href="/" class="bm-logo"><img src="/assets/logo.png" alt="BasMedia logo"></a>
    <nav class="bm-nav" id="mainNav">
      <a href="/">Anasayfa</a>
      <a href="/oyuncular.html">Oyuncular</a>
      <a href="/takimlar.html" class="active">Takımlar</a>
      <a href="/haberler.html">Haberler</a>
    </nav>
    <div class="bm-search" id="mainSearch">
      <span>🔍</span>
      <input type="text" id="quickSearch" placeholder="Oyuncu veya takım ara…">
    </div>
    <button class="bm-hamburger" id="hamburgerBtn" aria-label="Menü">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="container bm-section">
  <div class="bm-section-head">
    <div>
      <span class="bm-eyebrow">Kulüpler</span>
      <h2>Tüm Takımlar</h2>
    </div>
  </div>

  <div class="bm-filters">
    <select id="fSeason"></select>
    <select id="fLeague">
      <option value="">Tüm Ligler</option>
      <option value="NBA">NBA</option>
      <option value="EuroLeague">EuroLeague</option>
      <option value="BSL">BSL (Türkiye)</option>
    </select>
  </div>

  <div class="bm-grid cols-4" id="teamsGrid">
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
    <div class="bm-skel" style="aspect-ratio:1/1;"></div>
  </div>
</main>

<footer class="bm-footer">
  <div class="container">
    <div class="bottom">
      <span>© <span id="year"></span> BasMedia. Tüm hakları saklıdır.</span>
      <span>Bağımsız bir basketbol veri platformudur.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchTeams, fetchSeasons, formatCurrency } from "/js/app.js";
  document.getElementById("year").textContent = new Date().getFullYear();

  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const mainNav = document.getElementById("mainNav");
  const mainSearch = document.getElementById("mainSearch");
  hamburgerBtn.addEventListener("click", () => {
    hamburgerBtn.classList.toggle("open");
    mainNav.classList.toggle("mobile-open");
    mainSearch.classList.toggle("mobile-open");
  });
  mainNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    hamburgerBtn.classList.remove("open");
    mainNav.classList.remove("mobile-open");
    mainSearch.classList.remove("mobile-open");
  }));

  const quickSearch = document.getElementById("quickSearch");
  quickSearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && quickSearch.value.trim()) {
      window.location.href = `/oyuncular.html?q=${encodeURIComponent(quickSearch.value.trim())}`;
    }
  });

  const grid = document.getElementById("teamsGrid");
  const fSeason = document.getElementById("fSeason");
  const fLeague = document.getElementById("fLeague");
  const params = new URLSearchParams(window.location.search);
  if (params.get("league")) fLeague.value = params.get("league");

  function teamCard(t) {
    return `
      <a href="/turnuva/takim/${t.id}" class="bm-team-card">
        <div class="photo-wrap">
          <img src="${t.logoUrl || '/assets/logo.png'}" alt="${t.name}">
          ${t.playerCount != null ? `<span class="num">${t.playerCount} oyuncu</span>` : ""}
          <span class="value-tag">${formatCurrency(t.totalValue, t.totalValueCurrency || "EUR")}</span>
        </div>
        <div class="info">
          <p class="name">${t.name}</p>
          <p class="meta">${t.city || ""} · ${t.league || ""}</p>
        </div>
      </a>`;
  }

  async function loadSeasonOptions() {
    const seasons = await fetchSeasons();
    fSeason.innerHTML = seasons.map(s => `<option value="${s.id}">${s.label || s.id}</option>`).join("");
    const urlSeason = params.get("season");
    if (urlSeason && seasons.some(s => s.id === urlSeason)) fSeason.value = urlSeason;
  }

  async function load() {
    if (!fSeason.value) return;
    grid.innerHTML = Array(4).fill('<div class="bm-skel" style="aspect-ratio:1/1;"></div>').join("");
    try {
      const teams = await fetchTeams({ season: fSeason.value, league: fLeague.value || undefined });
      grid.innerHTML = teams.length
        ? teams.map(teamCard).join("")
        : `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">🏟️</div>Bu sezonda henüz takım eklenmedi.</div>`;
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div class="bm-empty" style="grid-column:1/-1;"><div class="icon">⚠️</div>Takımlar yüklenemedi.</div>`;
    }
  }
  fSeason.addEventListener("change", load);
  fLeague.addEventListener("change", load);
  loadSeasonOptions().then(load);
</script>
</body>
</html>
